name: Preview Screenshots

on:
  push:
    branches:
      - feat/index-safe-conversion-upgrade
    paths:
      - ".github/workflows/preview-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://hv-jewelers-git-feat-ind-031b10-hatfield-legacy-trusts-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright for screenshot capture
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture deployed preview
        shell: bash
        run: |
          mkdir -p preview-screenshots
          cat > /tmp/capture-preview.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          const baseUrl = process.env.PREVIEW_URL;
          const bypass = process.env.VERCEL_AUTOMATION_BYPASS_SECRET?.trim();
          const headers = bypass
            ? {
                'x-vercel-protection-bypass': bypass,
                'x-vercel-set-bypass-cookie': 'true',
              }
            : {};

          const targets = [
            {
              name: 'home-desktop',
              url: baseUrl,
              viewport: { width: 1440, height: 1200 },
              mobile: false,
            },
            {
              name: 'home-mobile',
              url: baseUrl,
              viewport: { width: 390, height: 844 },
              mobile: true,
            },
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const metadata = {
              requestedUrl: baseUrl,
              bypassConfigured: Boolean(bypass),
              captures: [],
            };

            try {
              let firstProductUrl = null;

              for (const target of targets) {
                const context = await browser.newContext({
                  viewport: target.viewport,
                  isMobile: target.mobile,
                  hasTouch: target.mobile,
                  extraHTTPHeaders: headers,
                });
                const page = await context.newPage();
                const response = await page.goto(target.url, {
                  waitUntil: 'domcontentloaded',
                  timeout: 90000,
                });
                await page.waitForTimeout(5000);

                if (!firstProductUrl) {
                  firstProductUrl = await page
                    .locator('a[href^="/shop/"]')
                    .first()
                    .getAttribute('href')
                    .catch(() => null);
                }

                const title = await page.title();
                const body = (await page.locator('body').innerText().catch(() => ''))
                  .replace(/\s+/g, ' ')
                  .trim()
                  .slice(0, 1000);
                const path = `preview-screenshots/${target.name}.png`;
                await page.screenshot({ path, fullPage: true });

                metadata.captures.push({
                  name: target.name,
                  status: response?.status() ?? null,
                  finalUrl: page.url(),
                  title,
                  bodyExcerpt: body,
                  screenshot: path,
                });
                await context.close();
              }

              if (firstProductUrl) {
                const productUrl = new URL(firstProductUrl, baseUrl).toString();
                for (const target of [
                  {
                    name: 'product-desktop',
                    viewport: { width: 1440, height: 1200 },
                    mobile: false,
                  },
                  {
                    name: 'product-mobile',
                    viewport: { width: 390, height: 844 },
                    mobile: true,
                  },
                ]) {
                  const context = await browser.newContext({
                    viewport: target.viewport,
                    isMobile: target.mobile,
                    hasTouch: target.mobile,
                    extraHTTPHeaders: headers,
                  });
                  const page = await context.newPage();
                  const response = await page.goto(productUrl, {
                    waitUntil: 'domcontentloaded',
                    timeout: 90000,
                  });
                  await page.waitForTimeout(5000);
                  const title = await page.title();
                  const body = (await page.locator('body').innerText().catch(() => ''))
                    .replace(/\s+/g, ' ')
                    .trim()
                    .slice(0, 1000);
                  const path = `preview-screenshots/${target.name}.png`;
                  await page.screenshot({ path, fullPage: true });
                  metadata.captures.push({
                    name: target.name,
                    status: response?.status() ?? null,
                    finalUrl: page.url(),
                    title,
                    bodyExcerpt: body,
                    screenshot: path,
                  });
                  await context.close();
                }
              }

              fs.writeFileSync(
                'preview-screenshots/preview-metadata.json',
                JSON.stringify(metadata, null, 2),
              );
              console.log(JSON.stringify(metadata, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          node /tmp/capture-preview.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hv-jewelers-preview-screenshots
          path: preview-screenshots
          if-no-files-found: error
          retention-days: 3
