          function makeProduct(seed: SeedProduct): ShopifyProduct {
            const image = {
              url: seed.image,
              altText: seed.title,
              width: 1200,
              height: 1200,
            }
            const money = { amount: seed.price, currencyCode: 'USD' }
            return {
              id: seed.id,
              handle: seed.handle,
              title: seed.title,
              description: seed.description,
              descriptionHtml: `<p>${seed.description}</p>`,
              vendor: 'HV Jewelers',
              productType: seed.productType,
              tags: seed.tags,
              availableForSale: true,
              totalInventory: 1,
              priceRange: { minVariantPrice: money, maxVariantPrice: money },
              compareAtPriceRange: null,
              featuredImage: image,
              images: [image],
              media: [{ mediaType: 'image', ...image }],
              options: [{ name: 'Title', values: ['Default Title'] }],
              variants: [
                {
                  id: seed.variantId,
                  title: 'Default Title',
                  sku: seed.sku,
                  availableForSale: true,
                  price: money,
                  compareAtPrice: null,
                  selectedOptions: [{ name: 'Title', value: 'Default Title' }],
                  image,
                },
              ],
              updatedAt: seed.updatedAt,
            }
          }

          const products = seeds.map(makeProduct)

          export async function listProducts(first = 50) {
            const visible = products.slice(0, first)
            return {
              products: visible,
              endCursor: null,
              hasNextPage: products.length > visible.length,
            }
          }

          export async function listAllProducts() {
            return products
          }

          export async function listAllProductsForPages() {
            return products
          }

          export async function getProductByHandle(handle: string) {
            return products.find((product) => product.handle === handle) ?? null
          }

          export async function listProductHandles(first = 250) {
            return products.slice(0, first).map(({ handle, updatedAt }) => ({
              handle,
              updatedAt,
            }))
          }
          TS

      - name: Build and start the visual preview
        shell: bash
        run: |
          npm run build
          npm start -- -p 3000 > /tmp/hv-preview.log 2>&1 &
          echo $! > /tmp/hv-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hv-preview.log
          exit 1

      - name: Capture desktop and mobile branch render
        shell: bash
        run: |
          mkdir -p preview-screenshots
          cat > capture-preview.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          const baseUrl = 'http://127.0.0.1:3000';
          const productUrl = `${baseUrl}/shop/platinum-yellow-gold-vintage-inspired-diamond-green-emerald-ring`;
          const metadata = { source: 'local feature-branch render', captures: [] };

          async function capture(browser, target) {
            const context = await browser.newContext({
              viewport: target.viewport,
              isMobile: target.mobile,
              hasTouch: target.mobile,
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();
            const response = await page.goto(target.url, {
              waitUntil: 'networkidle',
              timeout: 90000,
            });
            await page.waitForTimeout(2500);
            const screenshot = `preview-screenshots/${target.name}.png`;
            await page.screenshot({ path: screenshot, fullPage: true });
            metadata.captures.push({
              name: target.name,
              status: response?.status() ?? null,
              finalUrl: page.url(),
              title: await page.title(),
              bodyExcerpt: (await page.locator('body').innerText())
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 1200),
              screenshot,
            });
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              await capture(browser, {
                name: 'home-desktop',
                url: baseUrl,
                viewport: { width: 1440, height: 1200 },
                mobile: false,
              });
              await capture(browser, {
                name: 'home-mobile',
                url: baseUrl,
                viewport: { width: 390, height: 844 },
                mobile: true,
              });
              await capture(browser, {
                name: 'product-desktop',
                url: productUrl,
                viewport: { width: 1440, height: 1200 },
                mobile: false,
              });
              await capture(browser, {
                name: 'product-mobile',
                url: productUrl,
                viewport: { width: 390, height: 844 },
                mobile: true,
              });
            } finally {
              await browser.close();
            }
            fs.writeFileSync(
              'preview-screenshots/preview-metadata.json',
              JSON.stringify(metadata, null, 2),
            );
            console.log(JSON.stringify(metadata, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          node capture-preview.cjs

      - name: Stop preview server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/hv-preview.pid ]; then
            kill "$(cat /tmp/hv-preview.pid)" 2>/dev/null || true
          fi

      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hv-jewelers-rendered-preview
          path: preview-screenshots
          if-no-files-found: error
          retention-days: 3
