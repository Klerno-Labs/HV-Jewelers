name: Storefront CI

on:
  pull_request:
    paths:
      - "src/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storefront-ci.yml"
  push:
    branches:
      - feat/index-safe-conversion-upgrade
    paths:
      - "src/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storefront-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://hvjewelers.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npm run type-check

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  capture-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://hvjewelers.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install screenshot browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

