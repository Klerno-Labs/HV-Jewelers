name: Dependency Lock Repair

on:
  push:
    branches:
      - feat/index-safe-conversion-upgrade
    paths:
      - ".github/workflows/dependency-lock-repair.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/index-safe-conversion-upgrade

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Generate patched lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Block unresolved high-severity production findings
        run: npm audit --omit=dev --audit-level=high

      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore(deps): refresh patched package lock [skip ci]"
          git push origin HEAD:feat/index-safe-conversion-upgrade
